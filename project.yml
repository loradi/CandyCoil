name: CandyCoil
options:
  bundleIdPrefix: com.diego
  deploymentTarget:
    iOS: '17.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 7
targets:
  CandyCoil:
    type: application
    platform: iOS
    sources: [CandyCoil]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diego.candycoil
        DEVELOPMENT_TEAM: 79FR46R3Y5
        SUPABASE_URL: https://byhusbciuprgzqroldjs.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_9Sq1Lwg-6ydXmNqWIEHKUA_cUWQO6p6
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: CandyCoil/Info.plist
      properties:
        SUPABASE_URL: https://byhusbciuprgzqroldjs.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_9Sq1Lwg-6ydXmNqWIEHKUA_cUWQO6p6
        CFBundleDisplayName: Candy Coil
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.diego.candycoil
            CFBundleURLSchemes:
              - candycoil
  CandyCoilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CandyCoil
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CandyCoil
